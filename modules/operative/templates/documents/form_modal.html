<div class="modal fade" id="formModal" tabindex="-1" role="dialog" aria-labelledby="formModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="title_formModal">Cargue de Documento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form role="form" id="request-form" method="post" autocomplete="off" action="create/" enctype="multipart/form-data">
                <div class="modal-body">
                    {% csrf_token %}
                    <div class="row">
                        {% for field in form %}
                            {% if field.name != "observations" %}
                                <div class="col-lg-{% if field.name == "document_class" or field.name == "title" %}6{% else %}12{% endif %} col-md-12 mb-1">
                                    <label for="{{ field.id_for_label }}" id="label_{{ field.id_for_label }}">{{ field.label }}</label>
                                    <span id="section_{{field.id_for_label}}">{{field}}</span>
                                </div>
                            {% endif%}
                        {% endfor %}
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn bg-gradient-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn bg-gradient-primary" id="id_form_button" onclick="submit();">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
